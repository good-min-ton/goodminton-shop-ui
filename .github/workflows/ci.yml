name: CI - Type-check, Build & E2E

# Deployment is handled by Vercel, so this workflow only guards correctness:
# whatever Vercel builds from main should already have passed here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Type-check, build & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `next build` type-checks too, but running tsc first fails in seconds
      # instead of after a full production build.
      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # Playwright starts the dev server itself (see playwright.config.ts).
      # The suite covers UI behaviour only, so no backend is required.
      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
